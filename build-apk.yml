name: Build debug APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android project
        shell: bash
        run: |
          if [ -f android/gradlew ]; then dir=android
          elif [ -f gradlew ]; then dir=.
          else echo "Android project not found"; exit 1; fi
          echo "ANDROID_PROJECT=$dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Test, lint and build debug APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MyWidgetStudio-debug-apk
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: ${{ env.ANDROID_PROJECT }}/app/build/reports/
          if-no-files-found: ignore
